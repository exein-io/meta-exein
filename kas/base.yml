header:
  version: 14

distro: poky-altcfg

repos:
  meta-exein:

  poky:
    url: https://git.yoctoproject.org/git/poky
    branch: scarthgap
    layers:
      meta:
      meta-poky:

  meta-openembedded:
    url: https://git.openembedded.org/meta-openembedded
    branch: scarthgap
    layers:
      meta-oe:

  # Scarthgap ships rustc 1.75, but Pulsar 0.10.x is Rust edition 2024 and
  # needs 1.85 or newer -- cargo 1.75 cannot even parse the workspace manifest
  # ("feature `edition2024` is required"). The LTS rust mixin provides 1.98.1
  # for scarthgap, which is what makes this build possible at all.
  meta-lts-mixins-rust:
    url: https://git.yoctoproject.org/meta-lts-mixins
    branch: scarthgap/rust
    layers:
      .:

  # Scarthgap's oe-core has no clang recipe (clang was upstreamed later), and
  # pulsar's bpf-builder compiles the eBPF probes by invoking clang directly.
  # meta-clang provides clang-native for this release, so the probes are built
  # from a layer rather than from whatever compiler the build host happens to
  # have. Its clang recipe installs llvm-strip alongside clang, which
  # bpf-builder also invokes.
  meta-clang:
    url: https://github.com/kraj/meta-clang
    branch: scarthgap
    layers:
      .:

local_conf_header:
  btf: |
    DISTRO_FEATURES:append = " btf"
  optimizations: |
    # Keep the build directory small.
    INHERIT += "rm_work"
    # Allow SSH login with an empty root password (test images only).
    DROPBEAR_EXTRA_ARGS = "-B"
    QB_MEM = "-m 8G"
    QB_MEM:qemuarm64 = "-m 4G"
    # Slirp networking: unprivileged, no TAP required. The explicit 127.0.0.1
    # matters -- qemurunner parses "hostfwd=tcp:<ip>:<port>-" to find the SSH
    # port, and "tcp::<port>-" yields an empty ip that testimage cannot use.
    QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22"
    QEMU_USE_SLIRP = "1"
    TEST_RUNQEMUPARAMS = "slirp"
    TEST_SERVER_IP = "127.0.0.1"
