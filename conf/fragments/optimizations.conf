BB_CONF_FRAGMENT_SUMMARY = "optimizations"
BB_CONF_FRAGMENT_DESCRIPTION = "Build optimizations: rm_work, dropbear empty root password, QEMU memory/slirp"

# Allow SSH login with empty root password
DROPBEAR_EXTRA_ARGS = "-B"

# Remove work directories after each task to keep the build directory small
INHERIT += "rm_work"

# QEMU runtime memory allocation
QB_MEM = "-m 8G"
QB_MEM:qemuarm64 = "-m 4G"

# Use slirp networking (unprivileged, no TAP required).
# QB_SLIRP_OPT: actual QEMU netdev argument when slirp mode is active.
#   The explicit 127.0.0.1 is required: qemurunner.py parses
#   "hostfwd=tcp:<ip>:<port>-" to find the SSH port; "hostfwd=tcp::<port>-"
#   (double colon) yields an empty ip string and testimage cannot connect.
# QEMU_USE_SLIRP: tells the qemuboot.conf generator to record the slirp path.
# TEST_RUNQEMUPARAMS: passes "slirp" keyword to runqemu when testimage boots
#   the VM — without this, runqemu falls back to TAP and fails on hosts
#   where /dev/net/tun is not available.
# TEST_SERVER_IP: the host machine IP that the guest can reach back; required
#   by the testimage slirp target or it logs an error and aborts.
QB_SLIRP_OPT = "-netdev user,id=net0,hostfwd=tcp:127.0.0.1:2222-:22"
QEMU_USE_SLIRP = "1"
TEST_RUNQEMUPARAMS = "slirp"
TEST_SERVER_IP = "127.0.0.1"
